name: CLA Assistant

# Asks every outside contributor to sign the CLA in CONTRIBUTING.md by commenting on
# their pull request, and records signatures in the `cla-signatures` branch.
# Uses pull_request_target so it can comment on PRs from forks; it never checks out
# or runs code from the pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/atatatata01/Azra3D/blob/master/CONTRIBUTING.md#contributor-license-agreement-required
          branch: cla-signatures
          allowlist: atatatata01,dependabot[bot],github-actions[bot]
