<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AZRA Outliner Interactive Prototype</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap");

    :root {
      color-scheme: dark;
      --font-ui: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
      --font-mono: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
      --page: #090a0b;
      --panel: #141516;
      --top: #0c0d0e;
      --bar: #141516;
      --head: #191b1d;
      --body: #1d1f20;
      --row: #232526;
      --row-alt: #222425;
      --row-active: #2c2f30;
      --row-selected: #292c2d;
      --line: #18191b;
      --tree: #1d1f21;
      --field: #121315;
      --field-border: #2b2d30;
      --text: #e2e3e4;
      --body-text: #e3e5e7;
      --child-text: #c5c9ce;
      --muted: #7b8086;
      --accent: #f0a629;
      --blue: #3e9bff;
      --yellow: #ffbe38;
      --orange: #ff7a18;
      --sdf: #39d98a;
      --thumb: #555a60;
      --track: #151719;
      --border: #050607;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--page);
      font-family: var(--font-ui);
    }

    .outliner {
      width: 520px;
      height: 850px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    .tabs {
      height: 24px;
      display: flex;
      align-items: stretch;
      background: var(--top);
      user-select: none;
    }

    .move-dot {
      width: 30px;
      display: grid;
      place-items: center;
      cursor: context-menu;
    }

    .move-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      color: #030405;
      background: currentColor;
      display: block;
      transition: color .12s ease, filter .12s ease, transform .12s ease;
    }

    .move-dot:hover::before,
    .move-dot.menu-open::before {
      color: var(--accent);
      filter: drop-shadow(0 0 5px rgba(240,166,41,.32));
      transform: scale(1.08);
    }

    .tab {
      border: 0;
      background: transparent;
      color: #c7cacf;
      padding: 0 13px;
      font: 600 12px var(--font-mono);
      cursor: pointer;
    }

    .tab.active {
      background: #242628;
      color: var(--accent);
    }

    .tab:hover { background: #202225; }

    .toolbar {
      height: 28px;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 5px 8px;
      background: var(--bar);
      position: relative;
    }

    .add-main,
    .add-arrow {
      height: 20px;
      border: 1px solid #25272a;
      background: linear-gradient(#3c3e41, #36383b);
      color: #dce0e3;
      box-shadow: inset 0 1px #45474a, inset 0 -1px #2f3134;
      cursor: pointer;
      font-family: var(--font-mono);
      font-weight: 650;
      font-size: 14px;
    }

    .add-main {
      width: 112px;
      border-radius: 3px 0 0 3px;
    }

    .add-arrow {
      width: 24px;
      margin-left: -1px;
      border-radius: 0 3px 3px 0;
    }

    .filter {
      margin-left: auto;
      width: 94px;
      height: 18px;
      border-radius: 2px;
      border: 1px solid var(--field-border);
      background: var(--field);
      color: var(--child-text);
      padding: 0 8px;
      font: 500 12px var(--font-mono);
      outline: none;
    }

    .menu,
    .submenu {
      position: absolute;
      width: 170px;
      background: #1d1f21;
      border: 1px solid #34373a;
      border-radius: 3px;
      box-shadow: inset 0 1px #2a2d30, inset 0 -1px #2a2d30, 0 12px 26px rgba(0,0,0,.45);
      display: none;
      z-index: 5;
      padding: 4px 0;
    }

    .menu {
      top: 51px;
      left: 8px;
    }

    .submenu {
      top: -5px;
      left: 168px;
    }

    .menu.show { display: block; }

    .menu button,
    .menu-item {
      width: 100%;
      height: 25px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 0 10px;
      font: 500 12px var(--font-mono);
      cursor: pointer;
    }

    .menu button:hover,
    .menu-item:hover { background: #272a2d; }

    .submenu button {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-item:hover .submenu { display: block; }

    .menu-arrow {
      margin-left: auto;
      color: #aeb3b8;
    }

    .primitive-menu-label {
      color: var(--sdf);
    }

    .mini-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
      flex: 0 0 auto;
      color: var(--orange);
      position: relative;
    }

    .mini-icon.box {
      border: 2px solid currentColor;
      border-radius: 2px;
    }

    .mini-icon.sphere {
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    .mini-icon.cylinder {
      border: 2px solid currentColor;
      border-radius: 50% / 24%;
    }

    .mini-icon.cone::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 1px;
      width: 9px;
      height: 11px;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      border: 2px solid currentColor;
      background: transparent;
    }

    .header {
      height: 24px;
      display: grid;
      grid-template-columns: 34px 1fr 58px;
      background: var(--head);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #c5c8cb;
      font: 600 12px var(--font-mono);
    }

    .header > div {
      display: flex;
      align-items: center;
      border-right: 1px solid var(--line);
      padding-left: 8px;
    }

    .tree-wrap {
      height: calc(100% - 76px);
      background: var(--body);
      display: grid;
      grid-template-columns: 1fr 16px;
      grid-template-rows: 1fr 16px;
    }

    .tree {
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tree::-webkit-scrollbar { display: none; }

    .rows { min-width: 680px; padding-bottom: 120px; }

    .row {
      height: 25px;
      display: grid;
      grid-template-columns: 34px 1fr 58px;
      align-items: center;
      background: var(--row);
      color: var(--child-text);
      font-size: 13px;
      border-bottom: 1px solid rgba(0,0,0,.08);
      cursor: grab;
      user-select: none;
    }

    .row:active { cursor: grabbing; }

    .row:nth-child(even) { background: var(--row-alt); }
    .row.active { background: var(--row-active); }
    .row.selected { background: var(--row-selected); }
    .row.hidden .name { opacity: .45; }

    .cell {
      height: 25px;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--line);
      padding-left: 8px;
      min-width: 0;
    }

    .name {
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
    }

    .root .name { color: #f0f1f2; font-size: 15px; font-weight: 700; }
    .body-row .name { color: var(--body-text); font-size: 14px; font-weight: 650; }
    .child .name { color: var(--child-text); font-size: 13px; font-weight: 500; }
    .dim .name { color: #898e95; font-size: 12px; font-weight: 500; }

    .eye,
    .lock,
    .chev,
    .icon,
    .svg-icon {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .eye,
    .lock {
      color: #050607;
    }

    .lock {
      color: #a87735;
      opacity: 0;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 3px;
      cursor: pointer;
    }

    .row:hover .lock {
      opacity: .9;
    }

    .lock:hover {
      background: #3a3d40;
      color: #d0a15a;
    }

    .eye svg,
    .lock svg,
    .gear svg {
      width: 17px;
      height: 17px;
      display: block;
      stroke-width: 1.9;
    }

    .chev {
      color: #050607;
      font-size: 13px;
      transform: translateY(-1px);
    }

    .icon.mesh { color: var(--blue); }
    .icon.primitive,
    .icon.primitive-box,
    .icon.primitive-sphere,
    .icon.primitive-cylinder,
    .icon.primitive-cone { color: var(--sdf); }
    .icon.camera { color: #d5d7da; }
    .icon.light { color: var(--yellow); }
    .icon.body { color: var(--sdf); }

    .icon::before {
      content: "";
      display: block;
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-radius: 2px;
    }

    .icon.camera::before {
      border-radius: 2px;
      width: 12px;
      height: 8px;
      transform: translateX(-2px);
    }
    .icon.camera::after {
      content: "";
      width: 5px;
      height: 7px;
      border: 2px solid currentColor;
      border-left: 0;
      transform: translateX(-1px);
      clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 80%);
    }
    .icon.light::before {
      transform: rotate(45deg);
      width: 9px;
      height: 9px;
    }
    .icon.light.directional::after {
      content: "";
      width: 11px;
      border-top: 2px solid currentColor;
      transform: translateX(2px);
      box-shadow: 0 -4px 0 currentColor, 0 4px 0 currentColor;
      opacity: .75;
    }
    .icon.body::before { border-radius: 3px; }
    .icon.primitive::before,
    .icon.primitive-box::before { border-radius: 2px; }
    .icon.primitive-sphere::before { border-radius: 50%; }
    .icon.primitive-cylinder::before {
      border-radius: 50% / 24%;
      width: 13px;
      height: 11px;
    }
    .icon.primitive-cone::before {
      border: 0;
      width: 14px;
      height: 14px;
      background: currentColor;
      clip-path: polygon(50% 8%, 92% 88%, 8% 88%);
    }

    .svg-icon {
      color: var(--blue);
    }

    .svg-icon svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke-width: 1.8;
    }

    .svg-icon.scene-icon { color: var(--orange); }
    .svg-icon.camera-icon { color: #d5d7da; }
    .svg-icon.light-icon { color: var(--yellow); }
    .svg-icon.primitive-icon,
    .svg-icon.body-icon,
    .svg-icon.sdf-icon { color: var(--sdf); }
    .svg-icon.mesh-icon { color: var(--blue); }

    .sdf-row .name,
    .sdf-child .name,
    .primitive-row .name {
      color: var(--sdf);
    }

    .indent-0 { margin-left: 18px; }
    .indent-1 { margin-left: 40px; }
    .indent-2 { margin-left: 60px; }
    .indent-3 { margin-left: 80px; }

    .name {
      position: relative;
      padding-left: 0;
    }

    .name-content {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .branch-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 14px;
      pointer-events: none;
    }

    .branch-line.level-1 { left: 32px; }
    .branch-line.level-2 { left: 50px; }
    .branch-line.level-3 { left: 70px; }

    .branch-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: -13px;
      bottom: -13px;
      border-left: 1px dotted #141618;
    }

    .branch-line.elbow::after {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      width: 12px;
      border-top: 1px dotted #141618;
    }

    .branch-line.last::before {
      bottom: 12px;
    }

    .name-text { overflow: hidden; text-overflow: ellipsis; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4f96dc;
      margin-left: auto;
      margin-right: 12px;
    }

    .gear {
      color: #969ca3;
      opacity: 0;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 3px;
      cursor: pointer;
    }

    .row-actions {
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      padding-right: 5px;
    }

    .row:hover .gear,
    .row.selected:hover .gear {
      opacity: .9;
    }

    .gear:hover {
      background: #3a3d40;
      color: #d2d5d8;
    }

    .vscroll,
    .hscroll {
      background: #111214;
      position: relative;
    }

    .vscroll {
      grid-column: 2;
      grid-row: 1 / span 2;
    }

    .hscroll {
      grid-column: 1;
      grid-row: 2;
    }

    .v-track,
    .h-track {
      position: absolute;
      background: var(--track);
      border-radius: 5px;
    }

    .v-track {
      width: 10px;
      height: 196px;
      left: 3px;
      top: 76px;
    }

    .h-track {
      width: 196px;
      height: 10px;
      left: 112px;
      top: 3px;
    }

    .v-thumb,
    .h-thumb {
      position: absolute;
      background: var(--thumb);
      border-radius: 3px;
    }

    .v-thumb {
      width: 6px;
      height: 68px;
      left: 2px;
      top: 50px;
    }

    .h-thumb {
      width: 68px;
      height: 6px;
      left: 50px;
      top: 2px;
    }

    .placeholder {
      display: none;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .context,
    .panel-context {
      position: fixed;
      width: 154px;
      background: #202225;
      border: 1px solid #3a3d42;
      border-radius: 3px;
      box-shadow: 0 12px 26px rgba(0,0,0,.45);
      padding: 4px 0;
      display: none;
      z-index: 10;
    }

    .panel-context { width: 176px; }

    .context.show,
    .panel-context.show { display: block; }

    .context button,
    .panel-context button {
      width: 100%;
      height: 24px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 0 10px;
      font: 500 12px var(--font-mono);
      cursor: pointer;
    }

    .context button:hover,
    .panel-context button:hover { background: #383b3e; }

    .menu-separator {
      height: 1px;
      margin: 4px 0;
      background: #34373a;
    }
  </style>
</head>
<body>
  <section class="outliner" aria-label="Outliner prototype">
    <div class="tabs">
      <div class="move-dot" title="Panel move handle"></div>
      <button class="tab active" data-tab="Items">Items</button>
      <button class="tab" data-tab="Mesh Ops">Mesh Ops</button>
      <button class="tab" data-tab="Shading">Shading</button>
      <button class="tab" data-tab="Groups">Groups</button>
      <button class="tab" data-tab="Images">Images</button>
      <button class="tab" data-tab="+">+</button>
    </div>

    <div class="toolbar">
      <button class="add-main" id="addMain">Add Item</button>
      <button class="add-arrow" id="addArrow">▾</button>
      <input class="filter" id="filter" placeholder="Filter..." aria-label="Filter items">
    </div>

    <div class="menu" id="addMenu">
      <div class="menu-item">
        <span class="mini-icon box"></span>
        <span class="primitive-menu-label">Primitive</span>
        <span class="menu-arrow">›</span>
        <div class="submenu">
          <button data-add="Primitive Box"><span class="mini-icon box"></span>Box</button>
          <button data-add="Primitive Sphere"><span class="mini-icon sphere"></span>Sphere</button>
          <button data-add="Primitive Cylinder"><span class="mini-icon cylinder"></span>Cylinder</button>
          <button data-add="Primitive Cone"><span class="mini-icon cone"></span>Cone</button>
        </div>
      </div>
      <button data-add="Mesh">Mesh</button>
      <button data-add="Camera">Camera</button>
      <button data-add="Directional Light">Directional Light</button>
      <button data-add="SDF Body">SDF Body</button>
      <button data-add="Group">Group</button>
    </div>

    <div class="header">
      <div><span class="eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2.4 12S5.8 6.8 12 6.8 21.6 12 21.6 12 18.2 17.2 12 17.2 2.4 12 2.4 12Z"/><circle cx="12" cy="12" r="3"/></svg></span></div>
      <div>Name</div>
      <div></div>
    </div>

    <div class="tree-wrap">
      <div class="tree" id="tree">
        <div class="rows" id="rows"></div>
        <div class="placeholder" id="placeholder"></div>
      </div>
      <div class="vscroll"><div class="v-track"><div class="v-thumb"></div></div></div>
      <div class="hscroll"><div class="h-track"><div class="h-thumb"></div></div></div>
    </div>
  </section>

  <div class="context" id="context">
    <button data-action="rename">Rename</button>
    <button data-action="duplicate">Duplicate</button>
    <button data-action="toggle-lock">Toggle Lock</button>
    <button data-action="delete">Delete</button>
  </div>

  <div class="panel-context" id="panelContext">
    <button data-panel-action="split-horizontal">Split Horizontal</button>
    <button data-panel-action="split-vertical">Split Vertical</button>
    <button data-panel-action="duplicate-panel">Duplicate Panel</button>
    <button data-panel-action="float-panel">Float Panel</button>
    <div class="menu-separator"></div>
    <button data-panel-action="close">Close</button>
  </div>

  <script>
    const rowsEl = document.getElementById("rows");
    const filterEl = document.getElementById("filter");
    const menuEl = document.getElementById("addMenu");
    const contextEl = document.getElementById("context");
    const panelContextEl = document.getElementById("panelContext");
    const moveDotEl = document.querySelector(".move-dot");
    const placeholderEl = document.getElementById("placeholder");

    let selectedId = "root";
    let contextId = null;
    let counter = 1;

    const items = [
      { id: "root", parent: null, name: "Untitled", type: "scene", depth: 0, cls: "root", expanded: true, visible: true, locked: false },
      { id: "mesh", parent: "root", name: "Mesh", type: "mesh", depth: 1, cls: "body-row", visible: true, locked: false },
      { id: "mesh2", parent: "mesh", name: "Mesh (2)", type: "mesh", depth: 2, cls: "body-row", visible: true, locked: false },
      { id: "n", parent: "mesh2", name: "n", type: "mesh", depth: 3, cls: "dim", visible: true, locked: false },
      { id: "camera", parent: "root", name: "Camera", type: "camera", depth: 1, cls: "child", visible: true, locked: false },
      { id: "light", parent: "root", name: "Directional Light", type: "light directional", depth: 1, cls: "child", visible: true, locked: true },
      { id: "ref", parent: "root", name: "Reference Mesh", type: "mesh", depth: 1, cls: "child", visible: true, locked: false },
      { id: "sdf", parent: "root", name: "SDF Body", type: "body", depth: 1, cls: "sdf-row", visible: true, locked: false },
      { id: "hull", parent: "sdf", name: "Hull_Base", type: "sdf-child", depth: 2, cls: "sdf-child", visible: true, locked: false }
    ];

    function renderRows() {
      const query = filterEl.value.trim().toLowerCase();
      rowsEl.innerHTML = "";
      const visibleItems = items.filter(item => !query || item.name.toLowerCase().includes(query));

      visibleItems.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = [
          "row",
          item.cls,
          item.id === "root" ? "active" : "",
          item.id === selectedId ? "selected" : "",
          item.visible ? "" : "hidden",
          item.locked ? "locked" : ""
        ].filter(Boolean).join(" ");
        row.dataset.id = item.id;

        const branch = branchMarkup(item, visibleItems, index);
        const hasChildren = items.some(child => child.parent === item.id);

        row.innerHTML = `
          <div class="cell"><span class="eye">${eyeSvg(item.visible)}</span></div>
          <div class="cell name">
            ${branch}
            <span class="name-content indent-${item.depth}">
              <span class="chev">${hasChildren ? "▾" : ""}</span>
              ${iconSvg(item)}
              <span class="name-text">${item.name}</span>
            </span>
          </div>
          <div class="row-actions">
            <span class="lock" title="Toggle lock">${lockSvg()}</span>
            <span class="gear" title="Row options">${gearSvg()}</span>
          </div>
        `;

        row.addEventListener("click", event => {
          if (event.target.closest(".eye")) {
            item.visible = !item.visible;
          } else {
            selectedId = item.id;
          }
          renderRows();
        });

        row.addEventListener("contextmenu", event => {
          event.preventDefault();
          selectedId = item.id;
          contextId = item.id;
          renderRows();
          panelContextEl.classList.remove("show");
          moveDotEl.classList.remove("menu-open");
          contextEl.style.left = `${event.clientX}px`;
          contextEl.style.top = `${event.clientY}px`;
          contextEl.classList.add("show");
        });

        row.querySelector(".gear").addEventListener("click", event => {
          event.stopPropagation();
          selectedId = item.id;
          contextId = item.id;
          renderRows();
          panelContextEl.classList.remove("show");
          moveDotEl.classList.remove("menu-open");
          const rect = event.currentTarget.getBoundingClientRect();
          contextEl.style.left = `${rect.right + 4}px`;
          contextEl.style.top = `${rect.top}px`;
          contextEl.classList.add("show");
        });

        row.querySelector(".lock").addEventListener("click", event => {
          event.stopPropagation();
          item.locked = !item.locked;
          selectedId = item.id;
          renderRows();
        });

        rowsEl.appendChild(row);
      });
    }

    function showPlaceholder(name) {
      rowsEl.style.display = "none";
      placeholderEl.style.display = "block";
      placeholderEl.textContent = `${name} panel preview`;
    }

    function showItems() {
      rowsEl.style.display = "block";
      placeholderEl.style.display = "none";
      renderRows();
    }

    function branchMarkup(item, itemsInView, index) {
      if (item.depth <= 0) return "";
      let html = "";
      for (let level = 1; level <= item.depth; level += 1) {
        const isCurrent = level === item.depth;
        const continues = hasFollowingBranch(itemsInView, index, level);
        html += `<span class="branch-line level-${level}${isCurrent ? " elbow" : ""}${continues ? "" : " last"}"></span>`;
      }
      return html;
    }

    function hasFollowingBranch(itemsInView, index, level) {
      for (let i = index + 1; i < itemsInView.length; i += 1) {
        const nextDepth = itemsInView[i].depth;
        if (nextDepth < level) return false;
        if (nextDepth === level) return true;
      }
      return false;
    }

    function eyeSvg(visible) {
      return visible
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2.4 12S5.8 6.8 12 6.8 21.6 12 21.6 12 18.2 17.2 12 17.2 2.4 12 2.4 12Z"/><circle cx="12" cy="12" r="3"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3l18 18"/><path d="M10.6 6.9c.45-.07.92-.1 1.4-.1 6.2 0 9.6 5.2 9.6 5.2a17.8 17.8 0 0 1-2.4 2.9"/><path d="M6.2 8.2A17.4 17.4 0 0 0 2.4 12S5.8 17.2 12 17.2c1.2 0 2.3-.2 3.3-.55"/></svg>`;
    }

    function lockSvg() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`;
    }

    function gearSvg() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.24.32.44.66.6 1H20a2 2 0 1 1 0 4h-.1c-.16.36-.36.7-.6 1Z"/></svg>`;
    }

    function iconSvg(item) {
      const cls = item.icon || item.type;
      const common = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
      if (cls === "scene") {
        return `<span class="svg-icon scene-icon"><svg ${common}><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 6l3 4M13 6l3 4"/><path d="M8 15h8"/></svg></span>`;
      }
      if (cls === "camera") {
        return `<span class="svg-icon camera-icon"><svg ${common}><path d="M2 19V9C2 7.895 2.895 7 4 7H4.5C5.13 7 5.72 6.704 6.1 6.2L8.32 3.24C8.433 3.089 8.611 3 8.8 3H15.2C15.389 3 15.567 3.089 15.68 3.24L17.9 6.2C18.278 6.704 18.871 7 19.5 7H20C21.105 7 22 7.895 22 9V19C22 20.105 21.105 21 20 21H4C2.895 21 2 20.105 2 19Z"/><path d="M12 17C14.209 17 16 15.209 16 13C16 10.791 14.209 9 12 9C9.791 9 8 10.791 8 13C8 15.209 9.791 17 12 17Z"/></svg></span>`;
      }
      if (cls.includes("light")) {
        return `<span class="svg-icon light-icon"><svg ${common}><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/></svg></span>`;
      }
      if (cls === "body") {
        return `<span class="svg-icon body-icon"><svg ${common}><path d="M2.695 7.185L11.695 11.185L12.305 9.815L3.305 5.815L2.695 7.185ZM12.75 21.5V10.5H11.25V21.5H12.75ZM12.305 11.185L21.305 7.185L20.695 5.815L11.695 9.815L12.305 11.185Z" fill="currentColor" stroke="none"/><path d="M3 17.11V6.89C3 6.653 3.14 6.438 3.356 6.342L11.756 2.608C11.912 2.539 12.088 2.539 12.244 2.608L20.644 6.342C20.86 6.438 21 6.653 21 6.89V17.11C21 17.347 20.86 17.562 20.644 17.658L12.244 21.392C12.088 21.461 11.912 21.461 11.756 21.392L3.356 17.658C3.14 17.562 3 17.347 3 17.11Z"/><path d="M7.5 4.5L16.144 8.342C16.36 8.438 16.5 8.653 16.5 8.89V12.5"/></svg></span>`;
      }
      if (cls === "sdf-child") {
        return `<span class="svg-icon sdf-icon"><svg ${common}><path d="M21 7.353V16.647C21 16.865 20.882 17.066 20.691 17.172L12.291 21.838C12.11 21.939 11.89 21.939 11.709 21.838L3.309 17.172C3.118 17.066 3 16.865 3 16.647L3 7.353C3 7.135 3.118 6.934 3.309 6.829L11.709 2.162C11.89 2.061 12.11 2.061 12.291 2.162L20.691 6.829C20.882 6.934 21 7.135 21 7.353Z"/><path d="M3.528 7.294L11.709 11.838C11.89 11.939 12.11 11.939 12.291 11.838L20.5 7.278"/><path d="M12 21L12 12"/></svg></span>`;
      }
      if (cls === "primitive-sphere") {
        return `<span class="svg-icon primitive-icon"><svg ${common}><path d="M12 3C12.552 3 13 2.552 13 2C13 1.448 12.552 1 12 1C11.448 1 11 1.448 11 2C11 2.552 11.448 3 12 3Z" fill="currentColor"/><path d="M12 22C16.418 22 20 17.523 20 12C20 6.477 16.418 2 12 2C7.582 2 4 6.477 4 12C4 17.523 7.582 22 12 22Z"/><path d="M12 23C12.552 23 13 22.552 13 22C13 21.448 12.552 21 12 21C11.448 21 11 21.448 11 22C11 22.552 11.448 23 12 23Z" fill="currentColor"/></svg></span>`;
      }
      if (cls === "primitive-cylinder") {
        return `<span class="svg-icon primitive-icon"><svg ${common}><path d="M12 2C20 2 20 5 20 5C20 5 20 8 12 8C4 8 4 5 4 5C4 5 4 2 12 2Z"/><path d="M12 16C20 16 20 19 20 19C20 19 20 22 12 22C4 22 4 19 4 19C4 19 4 16 12 16Z"/><path d="M20 5V19"/><path d="M4 5V19"/></svg></span>`;
      }
      if (cls === "primitive-cone") {
        return `<span class="svg-icon primitive-icon"><svg ${common}><path d="M12 3L20 21H4L12 3Z"/><path d="M7.5 15.5C10.5 17 13.5 17 16.5 15.5"/></svg></span>`;
      }
      return `<span class="svg-icon ${cls === "primitive-box" || cls === "primitive" ? "primitive-icon" : "mesh-icon"}"><svg ${common}><path d="M21 7.353V16.647C21 16.865 20.882 17.066 20.691 17.172L12.291 21.838C12.11 21.939 11.89 21.939 11.709 21.838L3.309 17.172C3.118 17.066 3 16.865 3 16.647L3 7.353C3 7.135 3.118 6.934 3.309 6.829L11.709 2.162C11.89 2.061 12.11 2.061 12.291 2.162L20.691 6.829C20.882 6.934 21 7.135 21 7.353Z"/><path d="M3.528 7.294L11.709 11.838C11.89 11.939 12.11 11.939 12.291 11.838L20.5 7.278"/><path d="M12 21L12 12"/></svg></span>`;
    }

    function toggleMenu() {
      menuEl.classList.toggle("show");
    }

    document.getElementById("addMain").addEventListener("click", toggleMenu);
    document.getElementById("addArrow").addEventListener("click", toggleMenu);

    menuEl.addEventListener("click", event => {
      const button = event.target.closest("button[data-add]");
      if (!button) return;
      const type = button.dataset.add;
      const primitiveIcon = type === "Primitive Box" ? "primitive-box"
        : type === "Primitive Sphere" ? "primitive-sphere"
        : type === "Primitive Cylinder" ? "primitive-cylinder"
        : type === "Primitive Cone" ? "primitive-cone"
        : "";
      counter += 1;
      items.push({
        id: `added-${counter}`,
        name: type,
        type: type.includes("Primitive") ? "primitive" : type.includes("Camera") ? "camera" : type.includes("Light") ? "light directional" : type.includes("SDF") ? "body" : "mesh",
        icon: primitiveIcon,
        parent: "root",
        depth: 1,
        cls: type.includes("SDF") ? "sdf-row" : type.includes("Primitive") ? "primitive-row" : "child",
        visible: true,
        locked: false
      });
      selectedId = `added-${counter}`;
      menuEl.classList.remove("show");
      showItems();
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const name = tab.dataset.tab;
        if (name === "Items") showItems();
        else showPlaceholder(name);
      });
    });

    filterEl.addEventListener("input", renderRows);

    moveDotEl.addEventListener("contextmenu", event => {
      event.preventDefault();
      contextEl.classList.remove("show");
      menuEl.classList.remove("show");
      panelContextEl.style.left = `${event.clientX}px`;
      panelContextEl.style.top = `${event.clientY}px`;
      panelContextEl.classList.add("show");
      moveDotEl.classList.add("menu-open");
    });

    panelContextEl.addEventListener("click", event => {
      const action = event.target.closest("button")?.dataset.panelAction;
      if (!action) return;
      panelContextEl.classList.remove("show");
      moveDotEl.classList.remove("menu-open");
    });

    contextEl.addEventListener("click", event => {
      const action = event.target.closest("button")?.dataset.action;
      const item = items.find(entry => entry.id === contextId);
      if (!action || !item) return;

      if (action === "rename") {
        const next = prompt("Rename item", item.name);
        if (next) item.name = next;
      }
      if (action === "duplicate") {
        counter += 1;
        const clone = { ...item, id: `copy-${counter}`, name: `${item.name} Copy` };
        items.splice(items.indexOf(item) + 1, 0, clone);
        selectedId = clone.id;
      }
      if (action === "toggle-lock") item.locked = !item.locked;
      if (action === "delete" && item.id !== "root") {
        items.splice(items.indexOf(item), 1);
        selectedId = "root";
      }

      contextEl.classList.remove("show");
      renderRows();
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".menu") && !event.target.closest(".add-main") && !event.target.closest(".add-arrow")) {
        menuEl.classList.remove("show");
      }
      if (!event.target.closest(".context") && !event.target.closest(".gear")) {
        contextEl.classList.remove("show");
      }
      if (!event.target.closest(".panel-context") && !event.target.closest(".move-dot")) {
        panelContextEl.classList.remove("show");
        moveDotEl.classList.remove("menu-open");
      }
    });

    renderRows();
  </script>
</body>
</html>
